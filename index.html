<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nymphéas — The Resolution Paradox</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400;0,600;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8960c;
      --gold-light: #d4af37;
      --cream: #f5f0e8;
      --ink: #1a1714;
      --muted: #6b6055;
    }

    body, html {
      width: 100%; height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: #0e0c0a !important;
      overflow: hidden;
    }

    .arjs-loader {
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: #0e0c0a;
      z-index: 9999;
      display: flex; justify-content: center; align-items: center;
      color: var(--cream); flex-direction: column;
      transition: opacity 0.5s ease;
    }
    .arjs-loader p {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; letter-spacing: 0.05em; margin-bottom: 20px; text-align: center; padding: 0 1rem;
    }
    .start-btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--cream);
      padding: 0.8rem 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .start-btn:active {
      background: var(--gold);
      color: var(--ink);
    }

    .ui-overlay {
      position: absolute; inset: 0;
      z-index: 999 !important;
      pointer-events: none;
      display: none;
      flex-direction: column; justify-content: space-between;
    }

    header {
      text-align: center; padding: 1.5rem 1rem;
      background: linear-gradient(to bottom, rgba(14, 12, 10, 0.95) 40%, rgba(14, 12, 10, 0));
      color: var(--cream);
    }
    .museum-tag {
      font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 400; }
    h1 em { font-style: italic; color: var(--gold-light); }

    .controls-container {
      background: linear-gradient(to top, rgba(14, 12, 10, 0.95) 80%, rgba(14, 12, 10, 0));
      padding: 2rem 1.5rem 2.5rem 1.5rem;
      color: var(--cream);
      text-align: center;
    }
    
    .instruction-tap {
      font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream); opacity: 0.7; margin-bottom: 1rem;
    }

    .info-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(180,150,12,0.2); border: 1px solid rgba(180,150,12,0.15); }
    .info-cell { background: rgba(14, 12, 10, 0.95); padding: 0.5rem; text-align: center; }
    .info-val { font-family: 'Playfair Display', serif; font-size: 0.95rem; display: block; }
    .info-key { font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

    .a-enter-vr { display: none !important; }

    a-scene {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    video { z-index: -1 !important; position: absolute; top:0; left:0; }
  </style>
</head>
<body>

  <div class="arjs-loader" id="loader">
    <p id="loader-text">Nymphéas — The Resolution Paradox</p>
    <button class="start-btn" id="start-btn" onclick="initializeAR()">ENTRER DANS L'EXPÉRIENCE</button>
  </div>

  <div class="ui-overlay" id="ui">
    <header>
      <p class="museum-tag">Musée de l'Orangerie — Paris</p>
      <h1><em>Nymphéas</em> — The Resolution Paradox</h1>
    </header>

    <div class="controls-container">
      <p class="instruction-tap" id="status-text">Recherche du Monet imprimé...</p>

      <div class="info-strip">
        <div class="info-cell">
          <span class="info-val" id="val-truth">0%</span>
          <span class="info-key">Pollution</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-style" style="color: var(--gold-light);">Monet</span>
          <span class="info-key">Filtre Visuel</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-filter">Actif</span>
          <span class="info-key">Filtre Analogique</span>
        </div>
      </div>
    </div>
  </div>

  <div id="scene-container"></div>

  <script>
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const startBtn = document.getElementById('start-btn');
    const ui = document.getElementById('ui');

    function initializeAR() {
      startBtn.style.display = 'none';
      loaderText.textContent = "Analyse de la structure picturale...";

      // Création de la scène avec des ratios d'image adaptés (150m de large sur 135m de haut pour correspondre au tableau)
      const sceneHTML = `
        <a-scene embedded vr-mode-ui="enabled: false;" arjs="sourceType: webcam; debugUIEnabled: false;">
          <a-assets>
            <img id="monet-clean" src="assets/images/Monet.jpg">
            <img id="monet-polluted" src="assets/images/Monet%20pollué.png">
          </a-assets>

          <a-nft type="nft" url="assets/descriptors/monet" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <a-image id="ar-clean" src="#monet-clean" position="75 0 -67" rotation="-90 0 0" width="150" height="135" material="transparent: true; opacity: 1;"
                     animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 2000; startEvents: startTwist"></a-image>
            <a-image id="ar-polluted" src="#monet-polluted" position="75 0.2 -67" rotation="-90 0 0" width="150" height="135" material="transparent: true; opacity: 0;"
                     animation__fadein="property: material.opacity; from: 0; to: 1; dur: 2000; startEvents: startTwist"></a-image>
          </a-nft>
          <a-entity camera></a-entity>
        </a-scene>
      `;

      document.getElementById('scene-container').innerHTML = sceneHTML;
      ui.style.display = 'flex';

      window.addEventListener('camera-init', () => {
         document.body.style.setProperty('background-color', 'transparent', 'important');
         loader.style.opacity = '0';
         setTimeout(() => {
           loader.style.display = 'none';
         }, 500);
      });

      // Se déclenche UNIQUEMENT quand le téléphone reconnaît l'image imprimée
      window.addEventListener('markerFound', () => {
         startTimer();
      });
    }

    let timerStarted = false;
    function startTimer() {
      if (timerStarted) return; // Sécurité pour ne pas relancer le timer plusieurs fois
      timerStarted = true;

      const statusText = document.getElementById('status-text');
      const valTruth = document.getElementById('val-truth');
      const valStyle = document.getElementById('val-style');
      const valFilter = document.getElementById('val-filter');
      const arClean = document.getElementById('ar-clean');
      const arPolluted = document.getElementById('ar-polluted');

      statusText.textContent = "Œuvre détectée. Analyse d'origine (5s)";
      statusText.style.color = "var(--gold-light)";
      
      setTimeout(() => {
        statusText.textContent = "Altération de la réalité en cours...";
        statusText.style.color = "#e24b4a";

        if(arClean && arPolluted) {
          arClean.emit('startTwist');
          arPolluted.emit('startTwist');
        }

        setTimeout(() => {
          valTruth.textContent = '100%';
          valStyle.textContent = 'Vérité Nue';
          valStyle.style.color = '#e24b4a';
          valFilter.textContent = 'Désactivé';
          valFilter.style.color = '#e24b4a';
          statusText.textContent = "Résolution Paradoxale atteinte.";
        }, 2000);

      }, 5000); 
    }
  </script>
</body>
</html>
