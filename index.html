<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Water Lilies — The Resolution Paradox</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400;0,600;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    AFRAME.registerComponent('target-installer', {
      init: function () {
        const setupTarget = () => {
          XR8.XrController.configure({
            imageTargetData: [{
              "name": "monet-target",
              "type": "PLANAR",
              "imagePath": "assets/images/Monet.jpg", 
              "properties": {
                "left": 0, "top": 0,
                "width": 1000, "height": 900,
                "originalWidth": 1000, "originalHeight": 900,
                "isRotated": false
              }
            }]
          });
        };
        window.XR8 ? setupTarget() : window.addEventListener('xrloaded', setupTarget);
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8960c;
      --gold-light: #d4af37;
      --cream: #f5f0e8;
      --ink: #1a1714;
      --muted: #6b6055;
    }

    body, html {
      width: 100%; height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: #0e0c0a;
      overflow: hidden;
    }

    /* UI Layer over AR */
    .ui-overlay {
      position: absolute; inset: 0;
      z-index: 999 !important;
      pointer-events: none;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
    }

    header {
      text-align: center; padding: 1.5rem 1rem;
      background: linear-gradient(to bottom, rgba(14, 12, 10, 0.95) 40%, rgba(14, 12, 10, 0));
      color: var(--cream);
    }
    .museum-tag {
      font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 400; }
    h1 em { font-style: italic; color: var(--gold-light); }

    .controls-container {
      background: linear-gradient(to top, rgba(14, 12, 10, 0.95) 80%, rgba(14, 12, 10, 0));
      padding: 1.5rem 1.5rem 2.5rem 1.5rem;
      color: var(--cream);
      text-align: center;
    }
    
    .instruction-tap {
      font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream); opacity: 0.7; margin-bottom: 1.2rem;
    }

    /* Style du nouveau bouton d'action */
    .action-btn {
      pointer-events: auto; /* Permet de cliquer sur le bouton malgré le calque transparent */
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--cream);
      padding: 0.6rem 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
      display: none; /* Masqué par défaut, apparaît quand l'image est détectée */
    }
    .action-btn:active {
      background: var(--gold);
      color: var(--ink);
    }

    .info-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(180,150,12,0.2); border: 1px solid rgba(180,150,12,0.15); }
    .info-cell { background: rgba(14, 12, 10, 0.95); padding: 0.5rem; text-align: center; }
    .info-val { font-family: 'Playfair Display', serif; font-size: 0.95rem; display: block; }
    .info-key { font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>

  <div class="ui-overlay">
    <header>
      <p class="museum-tag">Musée de l'Orangerie — Paris</p>
      <h1><em>Water Lilies</em> — The Resolution Paradox</h1>
    </header>

    <div class="controls-container">
      <p class="instruction-tap" id="status-text">Scan the printed Monet...</p>

      <button class="action-btn" id="twist-btn" onclick="triggerTwistEffect()">TRIGGER TWIST</button>

      <div class="info-strip">
        <div class="info-cell">
          <span class="info-val" id="val-truth">0%</span>
          <span class="info-key">Pollution</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-style" style="color: var(--gold-light);">Monet</span>
          <span class="info-key">Visual Filter</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-filter">Active</span>
          <span class="info-key">Analog Filter</span>
        </div>
      </div>
    </div>
  </div>

  <a-scene
    target-installer
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <img id="monet-clean" src="assets/images/Monet.jpg" crossorigin="anonymous">
      <img id="monet-polluted" src="assets/images/Monet%20pollué.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="monet-target" id="monet-target-element">

      <a-image 
        id="ar-clean" 
        src="#monet-clean" 
        position="0 0 0" 
        rotation="0 0 90" 
        width="1.35" 
        height="1.5"
        material="transparent: true; opacity: 1;"
        animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 2000; startEvents: startTwist">
      </a-image>

      <a-image 
        id="ar-polluted" 
        src="#monet-polluted" 
        position="0 0 0.02" 
        rotation="0 0 90" 
        width="1.35" 
        height="1.5"
        material="transparent: true; opacity: 0;"
        animation__fadein="property: material.opacity; from: 0; to: 1; dur: 2000; startEvents: startTwist">
      </a-image>

    </xrextras-named-image-target>
  </a-scene>

  <script>
    const targetElement = document.getElementById('monet-target-element');
    const twistBtn = document.getElementById('twist-btn');
    const statusText = document.getElementById('status-text');

    // Événement : l'image imprimée est détectée par la caméra
    if (targetElement) {
      targetElement.addEventListener('xrimagefound', () => {
        statusText.textContent = "Artwork detected. Ready to transform.";
        statusText.style.color = "var(--gold-light)";
        twistBtn.style.display = "inline-block"; // On affiche le bouton à ce moment-là
      });
    }

    // Fonction déclenchée lors du clic sur le bouton "TRIGGER TWIST"
    function triggerTwistEffect() {
      // Masquer le bouton après le clic pour éviter les doubles clics
      twistBtn.style.display = "none";
      
      statusText.textContent = "Altering reality in progress...";
      statusText.style.color = "#e24b4a";

      const valTruth = document.getElementById('val-truth');
      const valStyle = document.getElementById('val-style');
      const valFilter = document.getElementById('val-filter');
      
      const arClean = document.getElementById('ar-clean');
      const arPolluted = document.getElementById('ar-polluted');

      // Déclenchement des animations de flou/fondu croisé A-Frame
      if(arClean && arPolluted) {
        arClean.emit('startTwist');
        arPolluted.emit('startTwist');
      }

      // Mise à jour finale des indicateurs du musée après les 2 secondes d'animation
      setTimeout(() => {
        valTruth.textContent = '100%';
        valStyle.textContent = 'Naked Truth';
        valStyle.style.color = '#e24b4a';
        valFilter.textContent = 'Disabled';
        valFilter.style.color = '#e24b4a';
        statusText.textContent = "Paradoxical Resolution reached.";
      }, 2000);
    }
  </script>
</body>
</html>
