<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Nymphéas — The Resolution Paradox</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400;0,600;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8960c;
      --gold-light: #d4af37;
      --cream: #f5f0e8;
      --ink: #1a1714;
      --muted: #6b6055;
    }

    body, html {
      width: 100%; height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: #0e0c0a;
      overflow: hidden;
    }

    /* Calque UI par-dessus l'AR */
    .ui-overlay {
      position: absolute; inset: 0;
      z-index: 999 !important;
      pointer-events: none;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
    }

    header {
      text-align: center; padding: 1.5rem 1rem;
      background: linear-gradient(to bottom, rgba(14, 12, 10, 0.95) 40%, rgba(14, 12, 10, 0));
      color: var(--cream);
    }
    .museum-tag {
      font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 400; }
    h1 em { font-style: italic; color: var(--gold-light); }

    .controls-container {
      background: linear-gradient(to top, rgba(14, 12, 10, 0.95) 80%, rgba(14, 12, 10, 0));
      padding: 2rem 1.5rem 2.5rem 1.5rem;
      color: var(--cream);
      text-align: center;
    }
    
    .instruction-tap {
      font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream); opacity: 0.7; margin-bottom: 1rem;
    }

    .info-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(180,150,12,0.2); border: 1px solid rgba(180,150,12,0.15); }
    .info-cell { background: rgba(14, 12, 10, 0.95); padding: 0.5rem; text-align: center; }
    .info-val { font-family: 'Playfair Display', serif; font-size: 0.95rem; display: block; }
    .info-key { font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>

  <div class="ui-overlay">
    <header>
      <p class="museum-tag">Musée de l'Orangerie — Paris</p>
      <h1><em>Nymphéas</em> — The Resolution Paradox</h1>
    </header>

    <div class="controls-container">
      <p class="instruction-tap" id="status-text">Visez le Monet imprimé...</p>

      <div class="info-strip">
        <div class="info-cell">
          <span class="info-val" id="val-truth">0%</span>
          <span class="info-key">Pollution</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-style" style="color: var(--gold-light);">Monet</span>
          <span class="info-key">Filtre Visuel</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-filter">Actif</span>
          <span class="info-key">Filtre Analogique</span>
        </div>
      </div>
    </div>
  </div>

  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <img id="monet-clean" src="assets/images/Monet.jpg" crossorigin="anonymous">
      <img id="monet-polluted" src="assets/images/Monet%20pollué.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="my-poster" id="monet-target-element">

      <a-image 
        id="ar-clean" 
        src="#monet-clean" 
        position="0 0 0" 
        width="1.5" 
        height="1.35"
        material="transparent: true; opacity: 1;"
        animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 2000; startEvents: startTwist">
      </a-image>

      <a-image 
        id="ar-polluted" 
        src="#monet-polluted" 
        position="0 0 0.05" 
        width="1.5" 
        height="1.35"
        material="transparent: true; opacity: 0;"
        animation__fadein="property: material.opacity; from: 0; to: 1; dur: 2000; startEvents: startTwist">
      </a-image>

    </xrextras-named-image-target>
  </a-scene>

  <script>
    // Correction de l'écouteur d'événement pour correspondre au cycle de vie de 8th Wall
    const targetElement = document.getElementById('monet-target-element');
    let timerStarted = false;

    if (targetElement) {
      targetElement.addEventListener('xrimagefound', () => {
        startTimer();
      });
    }

    function startTimer() {
      if (timerStarted) return; 
      timerStarted = true;

      const statusText = document.getElementById('status-text');
      const valTruth = document.getElementById('val-truth');
      const valStyle = document.getElementById('val-style');
      const valFilter = document.getElementById('val-filter');
      
      const arClean = document.getElementById('ar-clean');
      const arPolluted = document.getElementById('ar-polluted');

      statusText.textContent = "Œuvre détectée. Analyse d'origine (5s)";
      statusText.style.color = "var(--gold-light)";
      
      setTimeout(() => {
        statusText.textContent = "Altération de la réalité en cours...";
        statusText.style.color = "#e24b4a";

        if(arClean && arPolluted) {
          arClean.emit('startTwist');
          arPolluted.emit('startTwist');
        }

        setTimeout(() => {
          valTruth.textContent = '100%';
          valStyle.textContent = 'Vérité Nue';
          valStyle.style.color = '#e24b4a';
          valFilter.textContent = 'Désactivé';
          valFilter.style.color = '#e24b4a';
          statusText.textContent = "Résolution Paradoxale atteinte.";
        }, 2000);

      }, 5000); 
    }
  </script>
</body>
</html>
