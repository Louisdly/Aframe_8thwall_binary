<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nymphéas — The Resolution Paradox</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8960c;
      --gold-light: #d4af37;
      --cream: #f5f0e8;
      --ink: #1a1714;
      --muted: #6b6055;
    }

    body, html {
      width: 100%; height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: #000;
      overflow: hidden;
    }

    /* Écran de chargement initial */
    .arjs-loader {
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: #0e0c0a;
      z-index: 9999;
      display: flex; justify-content: center; align-items: center;
      color: var(--cream); flex-direction: column;
    }
    .arjs-loader p {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; letter-spacing: 0.05em; margin-bottom: 10px;
    }

    /* Calque UI par-dessus la caméra arrière */
    .ui-overlay {
      position: absolute; inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    header {
      text-align: center; padding: 1.5rem 1rem;
      background: linear-gradient(to bottom, rgba(14, 12, 10, 0.95) 40%, rgba(14, 12, 10, 0));
      color: var(--cream);
    }
    .museum-tag {
      font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 400; }
    h1 em { font-style: italic; color: var(--gold-light); }

    /* Zone du slider tactile en bas */
    .controls-container {
      background: linear-gradient(to top, rgba(14, 12, 10, 0.95) 80%, rgba(14, 12, 10, 0));
      padding: 2rem 1.5rem 2.5rem 1.5rem;
      pointer-events: auto;
      color: var(--cream);
    }
    .slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.8rem; }
    .slider-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    .slider-pct { font-family: 'Playfair Display', serif; font-size: 1.2rem; }

    /* Conception du bouton de défilement mobile */
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 3px;
      background: linear-gradient(to right, var(--gold-light) var(--pct, 0%), rgba(255,255,255,0.2) var(--pct, 0%));
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 32px; height: 32px;
      border-radius: 50%; background: var(--gold-light); border: 2px solid #0e0c0a; cursor: pointer;
    }

    .truth-bar-wrap { margin-top: 1.2rem; height: 3px; background: rgba(255,255,255,0.1); }
    .truth-bar-fill { height: 100%; width: 0%; background: linear-gradient(to right, #d4af37, #e24b4a); transition: width 0.1s ease; }

    .info-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 1.5rem; background: rgba(180,150,12,0.2); border: 1px solid rgba(180,150,12,0.15); }
    .info-cell { background: rgba(14, 12, 10, 0.95); padding: 0.5rem; text-align: center; }
    .info-val { font-family: 'Playfair Display', serif; font-size: 0.95rem; display: block; }
    .info-key { font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

    .a-enter-vr { display: none !important; }
  </style>
</head>
<body>

  <div class="arjs-loader">
    <p>Analyse de l'œuvre...</p>
    <span style="font-size: 0.7rem; color: var(--gold);">Veuillez patienter</span>
  </div>

  <div class="ui-overlay">
    <header>
      <p class="museum-tag">Musée de l'Orangerie — Paris</p>
      <h1><em>Nymphéas</em> — The Resolution Paradox</h1>
    </header>

    <div class="controls-container">
      <div class="slider-header">
        <span class="slider-label">Focus &amp; Résolution Digital</span>
        <span class="slider-pct" id="pct-display">0%</span>
      </div>
      
      <input type="range" id="resolution-slider" min="0" max="100" value="0">
      
      <div class="truth-bar-wrap">
        <div class="truth-bar-fill" id="truth-fill"></div>
      </div>

      <div class="info-strip">
        <div class="info-cell">
          <span class="info-val" id="val-truth">0%</span>
          <span class="info-key">Réalité</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-style" style="color: var(--gold-light);">Monet</span>
          <span class="info-key">Filtre Visuel</span>
        </div>
        <div class="info-cell">
          <span class="info-val" id="val-filter">Actif</span>
          <span class="info-key">Filtre Analogique</span>
        </div>
      </div>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
      <img id="monet-clean" src="Monet.jpg">
      <img id="monet-polluted" src="Monet pollué.jpg">
    </a-assets>

    <a-nft
      type="nft"
      url="monet-descriptors/monet"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5">
      
      <a-image 
        id="ar-clean" 
        src="#monet-clean" 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="150" 
        height="133"
        transparent="true"
        opacity="1">
      </a-image>

      <a-image 
        id="ar-polluted" 
        src="#monet-polluted" 
        position="0 0.5 0" 
        rotation="-90 0 0" 
        width="150" 
        height="133"
        transparent="true"
        opacity="0">
      </a-image>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener('arjs-nft-loaded', () => {
       document.querySelector('.arjs-loader').style.display = 'none';
    });

    const slider = document.getElementById('resolution-slider');
    const pctDisplay = document.getElementById('pct-display');
    const truthFill = document.getElementById('truth-fill');
    const valTruth = document.getElementById('val-truth');
    const valStyle = document.getElementById('val-style');
    const valFilter = document.getElementById('val-filter');

    const arClean = document.getElementById('ar-clean');
    const arPolluted = document.getElementById('ar-polluted');

    const labels = ['Monet', 'Impressionniste', 'Hybride', 'Réaliste', 'Vérité Nue'];

    slider.addEventListener('input', (e) => {
      const pct = parseInt(e.target.value);
      
      slider.style.setProperty('--pct', pct + '%');
      pctDisplay.textContent = pct + '%';
      valTruth.textContent = pct + '%';
      truthFill.style.width = pct + '%';

      // Gestion de la transparence croisée
      arClean.setAttribute('material', `opacity: ${1 - (pct / 100)}`);
      arPolluted.setAttribute('material', `opacity: ${pct / 100}`);

      const idx = Math.min(4, Math.floor(pct / 21));
      valStyle.textContent = labels[idx];

      if (pct < 30) {
        valFilter.textContent = 'Actif';
        valFilter.style.color = '#d4af37';
      } else if (pct < 70) {
        valFilter.textContent = 'Partiel';
        valFilter.style.color = '#6b6055';
      } else {
        valFilter.textContent = 'Désactivé';
        valFilter.style.color = '#e24b4a';
      }
    });

    slider.dispatchEvent(new Event('input'));
  </script>
</body>
</html>
